<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Mohid Fida. Automation and AI agents for back-office work.">
  <title>Mohid Fida</title>

  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#0E3323"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#050806" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#050806" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#050806" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="260" rx="12" fill="#050806"/>
  <rect width="1200" height="260" rx="12" fill="url(#dots)"/>
  <rect width="1200" height="260" rx="12" fill="url(#fade)"/>

  <!-- terminal frame -->
  <rect x="14" y="14" width="1172" height="232" rx="10" fill="#070D0A"/>
  <rect x="14" y="14" width="1172" height="232" rx="10" fill="none" stroke="#134D34" stroke-width="1.5"/>

  <!-- title bar -->
  <line x1="14" y1="62" x2="1186" y2="62" stroke="#0F3A28" stroke-width="1.5"/>
  <circle cx="44"  cy="38" r="6" fill="#1C6B48"/>
  <circle cx="66"  cy="38" r="6" fill="#186044"/>
  <circle cx="88"  cy="38" r="6" fill="#14563C"/>
  <text x="116" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#2F6A4F">mohid@github: ~</text>

  <!-- prompt -->
  <text x="46" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <tspan fill="#1F8A5C">$</tspan><tspan fill="#54A883" dx="10">whoami</tspan>
  </text>

  <!-- name -->
  <text x="46" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="50" font-weight="700" letter-spacing="2" fill="#00FF9C" filter="url(#glow)">MOHID FIDA</text>

  <!-- cursor -->
  <rect x="392" y="139" width="20" height="42" fill="#00FF9C" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.9;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- strapline -->
  <text x="48" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <tspan fill="#2F6A4F">&gt;</tspan><tspan fill="#5FBF92" dx="10">automation &amp; AI agents for back-office work</tspan>
  </text>

  <!-- corner tag -->
  <text x="1160" y="214" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" fill="#1F5C40">python · fastapi · flask · docker</text>
</svg>
